<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café &amp; Letras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Café &amp; Letras</h1>
        <p>Una taza, un libro y una buena frase para empezar el día.</p>
    </header>

    <main>
        <section id="tarjeta">
            <p id="texto-frase">“Leer es soñar de la mano de otro.”</p>
            <p id="autor-frase">— Fernando Pessoa</p>

            <div class="acciones">
                <button id="btn-nueva-frase">Nueva Frase Inspiradora</button>
                <button id="btn-cambiar-tema">Cambiar Modo Claro/Oscuro</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>

</html>
